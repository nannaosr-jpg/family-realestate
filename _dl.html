<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>wfs dl</title>
<style>
body{font:13px/1.6 ui-monospace,Menlo,monospace;padding:10px;background:#0f1113;color:#ddd}
a{display:block;padding:6px 8px;margin:3px 0;background:#1d2430;color:#8ecaff;text-decoration:none;border-radius:5px}
a:hover{background:#26333f}
</style></head>
<body>
<div id="top">…</div>
<div id="list"></div>
<script>
"use strict";
/* 프래그먼트(#base64url)의 링크 정의로 V-World WFS 다운로드 링크를 만든다. 서버로 전송되지 않는다.
   링크 정의: [라벨, 레이어, bbox[4], maxFeatures, output형식, 파일명] */
const KEY = 'D349EBB8-42C6-411F-BD68-545881B1B94A', DOMAIN = 'https://nannaosr-jpg.github.io';
const API = 'https://api.vworld.kr/req/wfs';
function dec(s) {
  s = s.replace(/-/g, '+').replace(/_/g, '/');
  const b = atob(s), u = new Uint8Array(b.length);
  for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i);
  return JSON.parse(new TextDecoder().decode(u));
}
const P = dec(location.hash.slice(1));
const list = document.getElementById('list');
document.getElementById('top').textContent = '작업 ' + P.links.length + '개';
P.links.forEach(([label, typename, bbox, maxf, output, fname, start]) => {
  const q = new URLSearchParams({
    key: KEY, domain: DOMAIN, service: 'WFS', version: '1.1.0', request: 'GetFeature',
    typename, srsname: 'EPSG:4326', output, maxFeatures: String(maxf), bbox: bbox.join(',')
  });
  if (fname) q.set('format_options', 'filename:' + fname);
  if (start) q.set('startIndex', String(start));
  const a = document.createElement('a');
  a.href = API + '?' + q.toString();
  a.textContent = label;
  list.appendChild(a);
});
</script>
</body></html>
