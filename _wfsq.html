<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>V-World WFS query</title>
<style>
body{font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;margin:0;padding:12px;background:#111;color:#ddd}
h1{font-size:14px;margin:0 0 8px;color:#9ef}
table{border-collapse:collapse;font-size:12px}td,th{border:1px solid #333;padding:2px 6px;text-align:left}
.ok{color:#7f7} .bad{color:#f88} .dim{color:#888}
</style></head>
<body>
<h1>V-World WFS 조회 (임시)</h1>
<div id="stat" class="dim">대기…</div>
<table id="tbl"></table>
<pre id="log"></pre>
<script>
"use strict";
const KEY='D349EBB8-42C6-411F-BD68-545881B1B94A';
const DOMAIN='https://nannaosr-jpg.github.io';
const API='https://api.vworld.kr/req/wfs';
const JOBS=[
  {name:'D-parcel', type:'lp_pa_cbnd_bubun', bbox:[127.0675,37.4992,127.0708,37.5012]},
  {name:'D-bld',    type:'lt_c_spbd',        bbox:[127.0675,37.4992,127.0708,37.5012]},
  {name:'S-parcel', type:'lp_pa_cbnd_bubun', bbox:[127.0098,37.4845,127.0132,37.4868]},
  {name:'S-bld',    type:'lt_c_spbd',        bbox:[127.0098,37.4845,127.0132,37.4868]},
  {name:'B01-parcel', type:'lp_pa_cbnd_bubun', bbox:[127.0745,37.4935,127.0778,37.4958]},
  {name:'B01-bld',    type:'lt_c_spbd',        bbox:[127.0745,37.4935,127.0778,37.4958]}
];
const log=document.getElementById('log');
const L=(s,c)=>{const d=document.createElement('div'); if(c)d.className=c; d.textContent=s; log.appendChild(d);};
const stat=document.getElementById('stat');

async function wfs(type,bbox,maxf){
  const p=new URLSearchParams({key:KEY,domain:DOMAIN,service:'WFS',version:'1.1.0',request:'GetFeature',
    typename:type,srsname:'EPSG:4326',output:'application/json',maxFeatures:String(maxf),bbox:bbox.join(',')});
  const r=await fetch(API+'?'+p.toString());
  const t=await r.text();
  if(!r.ok) throw new Error('HTTP '+r.status+' '+t.slice(0,200));
  let j; try{j=JSON.parse(t);}catch(e){throw new Error('JSON 아님: '+t.slice(0,200));}
  if(!j.features) throw new Error('features 없음: '+t.slice(0,200));
  return j.features;
}
const OUT={stamp:new Date().toISOString(), jobs:[], results:{}};
(async()=>{
  for(const j of JOBS){
    stat.textContent='조회 중: '+j.name;
    try{
      const f=await wfs(j.type,j.bbox,1000);
      OUT.jobs.push({name:j.name,type:j.type,bbox:j.bbox,count:f.length});
      OUT.results[j.name]=f;
      L('· '+j.name+' → '+f.length+'건','ok');
      if(j.type==='lp_pa_cbnd_bubun'){
        const tbl=document.getElementById('tbl');
        f.slice(0,80).forEach(x=>{
          const tr=document.createElement('tr');
          ['name','addr','jibun','pnu'].forEach(k=>{const td=document.createElement('td');td.textContent=(x.properties[k]||'');tr.appendChild(td);});
          tbl.appendChild(tr);
        });
      }
    }catch(e){ L('! '+j.name+' 실패: '+e.message,'bad'); OUT.jobs.push({name:j.name,error:e.message}); }
  }
  // 후보 건물 이름 요약
  ['D-bld','S-bld','B01-bld'].forEach(k=>{
    const f=OUT.results[k]||[];
    L('['+k+'] '+f.map(x=>(x.properties.buld_nm||'(무명)')+'/'+(x.properties.pnu||'').slice(-6)+'/'+x.properties.gro_flo_co).join(' | '),'dim');
  });
  const txt=JSON.stringify(OUT);
  stat.textContent='완료 — '+Math.round(txt.length/1024)+'KB';
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));
  a.download='vworld_dump.json';
  document.body.appendChild(a); a.click();
})();
</script>
</body></html>
